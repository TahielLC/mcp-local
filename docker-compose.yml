services:
  db_mcp_lab:
    image: postgres:15-alpine
    container_name: mcp_postgres_lab
    environment:
      POSTGRES_USER: mcp_admin
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: mcp_database
    ports:
      - "5433:5432" # Mapeamos al 5433 en tu máquina para no chocar con el Postgres nativo
    volumes:
      - mcp_pg_data:/var/lib/postgresql/data

volumes:
  mcp_pg_data: